[project]
name = "esp32-multiboard-studio"
version = "2.5.0"
description = "Local React + FastAPI + MicroPython studio for ESP32-C3/ESP32-S3 boards with extensible board profiles"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pyserial>=3.5,<4",
  "mpremote>=1.25,<2",
  "esptool>=5,<6",
]

[tool.uv]
package = false
